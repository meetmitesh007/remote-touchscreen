name: Build Android APK

on:
  push:
    branches:
      - main     # Triggers the build when you push to main
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK) 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Grant execute permission to your gradlew script
      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      # Step 4: Run the Gradle build command to compile a debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Step 5: Upload the generated APK so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
